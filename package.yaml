name:                inets-isomorphism
version:             0.1.0.0
github:              "Lamagraph/inets-isomorphism"
license:             MIT
author:              "Nikita Kabanov"
maintainer:          "kabanovnikita125@gmail.com"
copyright:           "2026 Nikita Kabanov"

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5
- containers
- clash-prelude
- lamagraph-core

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  inets-isomorphism-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - inets-isomorphism

tests:
  inets-isomorphism-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - inets-isomorphism
    - tasty
    - tasty-hunit